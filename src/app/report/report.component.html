<app-menu></app-menu>
<section class="reports">
  <h2>Saved Notes.</h2>
  <h6>
    Delete all?
    <button class="delall" (click)="deleteAllNotes()" *ngIf="notes.length > 0">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="red"
        width="20px"
        height="20px"
      >
        <path
          d="M3 6h18v2H3V6zm2 3h14l-1.5 12.5c-.1.8-.8 1.5-1.6 1.5H8.1c-.8 0-1.5-.7-1.6-1.5L5 9zm5 2v8h2v-8h-2zm4 0v8h2v-8h-2zM9 4V2h6v2h5v2H4V4h5z"
        />
      </svg>
    </button>
  </h6>

  <div *ngIf="notes.length > 0; else noNotes">
    <div class="report-item" *ngFor="let note of notes; let i = index">
      <h3>{{ note?.title }}</h3>
      <h5>{{ note?.details }}</h5>
      <p class="timeline">
        <span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18px"
            height="30px"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M9.00195 17H5.60636C4.34793 17 3.71872 17 3.58633 16.9023C3.4376 16.7925 3.40126 16.7277 3.38515 16.5436C3.37082 16.3797 3.75646 15.7486 4.52776 14.4866C5.32411 13.1835 6.00031 11.2862 6.00031 8.6C6.00031 7.11479 6.63245 5.69041 7.75766 4.6402C8.88288 3.59 10.409 3 12.0003 3C13.5916 3 15.1177 3.59 16.2429 4.6402C17.3682 5.69041 18.0003 7.11479 18.0003 8.6C18.0003 11.2862 18.6765 13.1835 19.4729 14.4866C20.2441 15.7486 20.6298 16.3797 20.6155 16.5436C20.5994 16.7277 20.563 16.7925 20.4143 16.9023C20.2819 17 19.6527 17 18.3943 17H15.0003M9.00195 17L9.00031 18C9.00031 19.6569 10.3435 21 12.0003 21C13.6572 21 15.0003 19.6569 15.0003 18V17M9.00195 17H15.0003"
              stroke="#ffffff"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <span style="margin: -3px 13px">{{
          note?.dateTime | date : "MMMM d, y h:mm a"
        }}</span>
      </p>
      <p>
        <small class="current-stamp">
          Created: {{ note?.currentTime | date : "MMMM d, y h:mm a" }}</small
        >
      </p>
      <button (click)="deleteNote(i)" class="del">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="#fff"
          width="24px"
          height="24px"
        >
          <path
            d="M16 9v10H8V9h8m-1.5-6h-5l-1 1H5v2h14V4h-3.5l-1-1zM18 7H6v12c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7z"
          />
        </svg>
      </button>
    </div>
  </div>
  <ng-template #noNotes>
    <p>No notes found.</p>
  </ng-template>
</section>
